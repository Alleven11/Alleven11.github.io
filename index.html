<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同学画像猜猜乐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* 关键：让 main 自动填充剩余空间，把 footer 顶到最下面 */
        main {
            flex: 1;
        }
        /* 3D翻转核心样式 */
        .flip-card {
            perspective: 1000px;
            height: 600px;
            width: 100%;
            --global-flip: 0deg;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            transform: rotateY(var(--global-flip));
        }
        /* 悬浮叠加翻转效果 */
        .flip-card:hover .flip-card-inner {
            transform: rotateY(calc(var(--global-flip) + 180deg));
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1rem;
        }
        .flip-card-back {
            transform: rotateY(180deg);
            align-items: center;
            justify-content: center;
        }
        
        /* 手机端专属样式 */
        @media (max-width: 640px) {
            html, body {
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            input {
                font-size: 16px !important;
            }
            .bottom-sticky-btn {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 40;
                padding: 16px;
                background: linear-gradient(to top, rgba(248, 250, 252, 1), rgba(248, 250, 252, 0.9));
                backdrop-filter: blur(8px);
            }
            .content-with-bottom-btn {
                padding-bottom: 100px;
            }
            /** 手机高度 */
            .flip-card {
                height: 600px;
            }
        }
        
        /* 图片适配 */
        .card-img {
            width: 100%;
            height: auto;
            max-height: 90%;
            object-fit: contain;
            display: block;
        }
        
        /* 弹窗遮罩 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 60;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-box {
            background: white;
            border-radius: 1rem;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-light to-blue-50 min-h-screen font-sans text-dark">
    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-primary flex items-center">

                <span>同学画像看看乐</span>
            </h1>
            <div id="score-display" class="hidden text-base font-semibold text-primary">
                <i class="fa fa-trophy mr-1 text-accent"></i>
                <span id="score">0</span>/43
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        <!-- 欢迎区域 -->
        <section id="welcome-section" class="mb-8 text-center">
            <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
                <h2 class="text-2xl md:text-3xl font-bold mb-4 text-dark">欢迎来到同学画像看看乐！</h2>
                <p class="text-base md:text-lg text-gray-600 mb-6">
                    点击悬停卡片查看同学画像，双击卡片查看人物详情！
                </p>
                <button id="start-btn" class="bg-primary text-white font-medium py-3 px-6 rounded-lg shadow-lg hover:bg-primary/90 transition-all">
                    <i class="fa fa-play mr-2"></i>开始观看
                </button>
            </div>
        </section>

        <!-- 游戏区域 -->
        <section id="game-section" class="hidden">
            <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center">
                <p class="text-sm md:text-base text-gray-600 mb-3 sm:mb-0">
                    点击看画像、双击查看人物详情
                </p>
                <button id="reset-btn" class="bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg hover:bg-gray-300 transition-all">
                    <i class="fa fa-refresh mr-2"></i>翻转
                </button>
            </div>

            <!-- 布局修改：移动端1列，电脑端3列 -->
            <div id="images-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4 content-with-bottom-btn">
            </div>
        </section>

        <!-- 详情弹窗：移除图像，只保留姓名和描述 -->
        <div id="detail-modal" class="modal-mask">
            <div class="modal-box">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-primary" id="modal-name"></h3>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700 text-xl">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div id="modal-desc" class="text-gray-700 leading-relaxed text-lg"></div>
            </div>
        </div>

        <!-- 结果区域 -->
        <section id="results-section" class="hidden">
            <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8">
                <div class="text-center mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold mb-4 text-dark">挑战完成！</h2>
                    <div class="text-5xl md:text-6xl font-bold mb-4 text-primary" id="final-score">0/43</div>
                    <p class="text-base md:text-lg text-gray-600 mb-6" id="result-message">你认出了这么多老同学！</p>
                    <div class="flex flex-wrap justify-center gap-3">
                        <button id="retry-btn" class="bg-primary text-white py-2 px-4 rounded-lg hover:bg-primary/90">
                            <i class="fa fa-refresh mr-2"></i>再试一次
                        </button>
                        <button id="show-answers-btn" class="bg-secondary text-white py-2 px-4 rounded-lg hover:bg-secondary/90">
                            <i class="fa fa-eye mr-2"></i>查看所有答案
                        </button>
                    </div>
                </div>
                <div id="answers-detail" class="hidden mt-6">
                    <h3 class="text-xl font-bold mb-4 text-center">详细答案</h3>
                    <div id="answers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-1">同学画像看看乐 &copy; 2026</p>
        </div>
    </footer>

            { id: 42, name: "黄文壕", image: "images/image-42.png" ,description: "不懂你的黑色幽默，想通却又在考倒我"},
            { id: 43, name: "连志威", image: "images/image-43.png" ,description: "人生不过葱姜蒜"}
        ];

        let userAnswers = {};
        let correctAnswers = {};
        let score = 0;
        // 全局翻转状态：0=正面朝上，180=背面朝上
        let globalFlipDeg = 0;

        const welcomeSection = document.getElementById('welcome-section');
        const gameSection = document.getElementById('game-section');
        const resultsSection = document.getElementById('results-section');
        const imagesGrid = document.getElementById('images-grid');
        const answersGrid = document.getElementById('answers-grid');
        const scoreDisplay = document.getElementById('score-display');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const resultMessageElement = document.getElementById('result-message');
        const answersDetail = document.getElementById('answers-detail');
        const detailModal = document.getElementById('detail-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const modalName = document.getElementById('modal-name');
        const modalDesc = document.getElementById('modal-desc');
        const flipAllBtn = document.getElementById('reset-btn');

        classmates.forEach(classmate => {
            correctAnswers[classmate.id] = classmate.name;
        });

        closeModalBtn.addEventListener('click', () => detailModal.style.display = 'none');
        detailModal.addEventListener('click', (e) => {
            if(e.target === detailModal) detailModal.style.display = 'none';
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            welcomeSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            scoreDisplay.classList.remove('hidden');
            renderGameCards();
        });

        function renderGameCards() {
            imagesGrid.innerHTML = '';
            const shuffledClassmates = [...classmates].sort(() => Math.random() - 0.5);
            
            shuffledClassmates.forEach(classmate => {
                const card = document.createElement('div');
                card.className = 'flip-card';
                // 同步全局翻转角度
                card.style.setProperty('--global-flip', `${globalFlipDeg}deg`);
                card.innerHTML = `
                    <div class="flip-card-inner">
                        <!-- 正面：显示名字 -->
                        <div class="flip-card-front flex flex-col justify-center items-center">
                            <p class="text-xl font-bold text-primary">${classmate.name}</p>
                            <p class="text-sm text-gray-400 mt-2">悬浮看画像 | 点击看详情</p>
                        </div>
                        <!-- 背面：只保留画像，彻底移除文字和输入框 -->
                        <div class="flip-card-back">
                            <img src="${classmate.image}" alt="${classmate.name}画像" class="card-img" loading="lazy">
                        </div>
                    </div>
                `;
                // 双击打开详情弹窗
                card.addEventListener('dblclick', () => {
                    modalName.textContent = classmate.name;
                    modalDesc.textContent = classmate.description;
                    detailModal.style.display = 'flex';
                });
                imagesGrid.appendChild(card);
            });
        }

        // 【核心：全局翻转按钮逻辑】
        flipAllBtn.addEventListener('click', () => {
            // 切换状态 0 ↔ 180
            globalFlipDeg = globalFlipDeg === 0 ? 180 : 0;
            // 获取所有卡片，统一更新CSS变量
            const allCards = document.querySelectorAll('.flip-card');
            allCards.forEach(card => {
                card.style.setProperty('--global-flip', `${globalFlipDeg}deg`);
            });
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            resultsSection.classList.add('hidden');
            gameSection.classList.remove('hidden');
            userAnswers = {};
            score = 0;
            // 重试时重置为全部正面
            globalFlipDeg = 0;
            renderGameCards();
        });

        document.getElementById('show-answers-btn').addEventListener('click', () => {
            answersDetail.classList.toggle('hidden');
        });
    </script>
</body>
</html>
